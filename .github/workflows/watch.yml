name: student-village-watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sv-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so rebase works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SV_STATE_FILE: sv_state.json
        run: python sv_watcher.py

      - name: Persist state (safe push, with retry)
        run: |
          if [[ -z "$(git status --porcelain sv_state.json)" ]]; then
            echo "No state change - nothing to commit."
            exit 0
          fi
          git config user.name  "sv-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sv_state.json
          git commit -m "Update watcher state [skip ci]"
          # Rebase our state commit on top of whatever is newest, preferring ours
          # for the state file (last-write-wins), then push. Retry a few times.
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || git rebase --abort
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; retrying..."
            sleep 3
          done
          echo "Could not push state after retries."
          exit 1
